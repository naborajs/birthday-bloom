name: Auto Assign Issues

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    if: ${{ !github.event.issue.pull_request && (contains(github.event.comment.body, '/assign') || contains(github.event.comment.body, 'can I take this')) }}
    steps:
      - name: Check if already assigned
        id: check_assignees
        run: |
          if [ "${{ join(github.event.issue.assignees.*.login, '') }}" != "" ]; then
            echo "assigned=true" >> $GITHUB_ENV
          else
            echo "assigned=false" >> $GITHUB_ENV
          fi

      - name: Assign Issue
        if: env.assigned == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNo = context.payload.issue.number;
            const user = context.payload.comment.user.login;
            
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNo,
              assignees: [user]
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNo,
              body: `### 🌸 Welcome to Birthday Bloom!\n\nHello @${user}, this issue has been successfully assigned to you! \n\n**Important Rule:** If there is no activity (no comments or linked PRs) from you in the next **48 hours**, you may be automatically unassigned so others can take over.\n\nHappy coding! 🚀`
            });
