name: Sync Labels

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-labels.yml'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    name: Sync Repository Labels
    runs-on: ubuntu-latest
    steps:
      - name: Sync Labels
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let config;
            try {
              config = JSON.parse(fs.readFileSync('.github/automation.config.json', 'utf8'));
            } catch (err) {
              console.error("Failed to read config:", err);
              process.exit(1);
            }
            const labels = config.labels || [];
            
            for (const label of labels) {
              try {
                // Try to get the label first
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
                console.log(`Updating label: ${label.name}`);
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (error) {
                if (error.status === 404) {
                  console.log(`Creating label: ${label.name}`);
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                } else {
                  console.error(`Failed to handle label ${label.name}:`, error);
                  throw error;
                }
              }
            }

            // Delete obsolete level and duplicate type/area/scope labels
            const labelsToDelete = config.labelsToDelete || [];

            for (const labelName of labelsToDelete) {
              try {
                await github.rest.issues.deleteLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName
                });
                console.log(`Successfully deleted obsolete label: ${labelName}`);
              } catch (error) {
                if (error.status !== 404) {
                  console.error(`Failed to delete label ${labelName}:`, error);
                } else {
                  console.log(`Label ${labelName} already deleted or not found.`);
                }
              }
            }


